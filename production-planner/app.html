<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATC Produktion - Mitarbeiter</title>
  <style>
    :root {
      --primary: #1a3a5c;
      --primary-light: #2c5f8a;
      --accent: #e67e22;
      --success: #27ae60;
      --danger: #e74c3c;
      --warning: #f39c12;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #2c3e50;
      --text-light: #7f8c8d;
      --border: #dce1e6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); max-width: 600px; margin: 0 auto;
      min-height: 100vh;
    }

    /* App Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .app-header-top { display: flex; justify-content: space-between; align-items: center; }
    .app-header h1 { font-size: 18px; font-weight: 600; }
    .app-header .user-info { font-size: 12px; opacity: 0.85; margin-top: 4px; }
    .header-link { color: white; text-decoration: none; font-size: 12px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; }

    /* Login Screen */
    .login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 40px 20px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
    }
    .login-logo { font-size: 48px; margin-bottom: 16px; }
    .login-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 32px; }
    .login-card {
      background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .login-card label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 6px; font-weight: 500; }
    .login-card select, .login-card input {
      width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 16px; color: var(--text); margin-bottom: 20px; background: white;
    }
    .login-card select:focus, .login-card input:focus { outline: none; border-color: var(--primary); }
    .login-btn {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .login-btn:hover { background: var(--primary-light); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto;
      background: white; display: flex; border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05); z-index: 100;
    }
    .nav-item {
      flex: 1; padding: 10px 0; text-align: center; cursor: pointer;
      color: var(--text-light); font-size: 11px; transition: color 0.2s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }

    /* Page Content */
    .page { display: none; padding: 16px 16px 80px; }
    .page.active { display: block; }

    /* Cards */
    .card {
      background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* Today Section */
    .date-header {
      font-size: 13px; color: var(--text-light); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 600;
    }

    /* Task Card */
    .task-card {
      border-left: 4px solid var(--primary); position: relative;
    }
    .task-card.completed { border-left-color: var(--success); opacity: 0.7; }
    .task-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .task-subtitle { font-size: 12px; color: var(--text-light); }
    .task-meta { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .task-meta-item {
      font-size: 11px; color: var(--text-light); background: var(--bg);
      padding: 3px 8px; border-radius: 4px;
    }
    .task-actions { margin-top: 12px; display: flex; gap: 8px; }

    /* Progress Bar */
    .progress-bar { height: 6px; background: #ecf0f1; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

    /* Badge */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 600;
    }
    .badge-success { background: #d5f5e3; color: #27ae60; }
    .badge-warning { background: #fdebd0; color: #e67e22; }
    .badge-danger { background: #fadbd8; color: #e74c3c; }
    .badge-info { background: #d6eaf8; color: #2980b9; }
    .badge-neutral { background: var(--bg); color: var(--text-light); }

    /* Buttons */
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-accent { background: var(--accent); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-block { display: block; width: 100%; }
    .btn-sm { padding: 7px 14px; font-size: 13px; }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-light); }
    .form-control {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 15px; color: var(--text); background: white;
    }
    .form-control:focus { outline: none; border-color: var(--primary); }
    textarea.form-control { resize: vertical; min-height: 80px; }

    /* Report Form */
    .report-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* Photo Upload */
    .photo-upload {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    }
    .photo-preview {
      width: 80px; height: 80px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--border);
    }
    .photo-add {
      width: 80px; height: 80px; border-radius: 8px; border: 2px dashed var(--border);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 28px; color: var(--text-light); background: var(--bg);
    }
    .photo-add:hover { border-color: var(--primary); color: var(--primary); }

    /* Project Overview Card */
    .project-overview-card { margin-bottom: 12px; }
    .project-progress { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }
    .progress-item { text-align: center; }
    .progress-item .label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
    .progress-item .value { font-size: 20px; font-weight: 700; }

    /* Deviation toggle */
    .toggle-group { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); }
    .toggle-option {
      flex: 1; padding: 10px; text-align: center; cursor: pointer;
      font-size: 14px; font-weight: 500; background: white; color: var(--text);
      border: none; transition: all 0.2s;
    }
    .toggle-option.active-yes { background: var(--success); color: white; }
    .toggle-option.active-no { background: var(--danger); color: white; }

    /* History */
    .history-item {
      display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .history-date {
      font-size: 12px; color: var(--text-light); min-width: 60px; padding-top: 2px;
    }
    .history-content { flex: 1; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Weekly View */
    .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .week-nav-btn {
      background: var(--primary); color: white; border: none; border-radius: 8px;
      padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    }
    .week-nav-btn:hover { background: var(--primary-light); }
    .week-nav-label { font-size: 15px; font-weight: 600; color: var(--text); }
    .week-days { display: flex; flex-direction: column; gap: 12px; }
    .week-day-card {
      background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .week-day-header {
      padding: 10px 16px; font-weight: 600; font-size: 14px;
      background: var(--primary); color: white; display: flex;
      justify-content: space-between; align-items: center; cursor: pointer;
    }
    .week-day-header.today-highlight { background: var(--accent); }
    .week-day-header .day-badge {
      font-size: 11px; background: rgba(255,255,255,0.25); padding: 2px 8px;
      border-radius: 10px;
    }
    .week-day-body { padding: 0; }
    .week-day-body.collapsed { display: none; }
    .week-task-item {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .week-task-item:last-child { border-bottom: none; }
    .week-task-info { flex: 1; }
    .week-task-title { font-size: 13px; font-weight: 600; }
    .week-task-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .week-task-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

    /* Daily Report Quick Button */
    .daily-report-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #d35400);
      color: white; border: none; border-radius: 12px; font-size: 15px;
      font-weight: 600; cursor: pointer; margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(230, 126, 34, 0.3);
    }
    .daily-report-btn:hover { opacity: 0.9; }
    .daily-report-btn .report-icon { font-size: 20px; }

    /* Daily Report Modal */
    .report-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 200; display: flex;
      align-items: flex-end; justify-content: center;
    }
    .report-modal {
      background: white; border-radius: 16px 16px 0 0; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto; padding: 20px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .report-modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .report-modal-close {
      background: none; border: none; font-size: 24px; cursor: pointer;
      color: var(--text-light); padding: 4px;
    }
    .report-task-list { margin-bottom: 16px; }
    .report-task-entry {
      background: var(--bg); border-radius: 8px; padding: 12px;
      margin-bottom: 8px; border-left: 3px solid var(--primary);
    }
    .report-task-entry .task-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
    }
    .report-date-picker {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      background: var(--bg); border-radius: 8px; padding: 10px 12px;
    }
    .report-date-picker input[type="date"] {
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
      font-size: 14px; font-family: inherit; flex: 1; color: var(--text);
    }
    .report-date-picker label { font-size: 13px; font-weight: 600; white-space: nowrap; }
    .report-section-label {
      font-size: 13px; font-weight: 600; color: var(--primary); margin: 12px 0 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .report-other-tasks-toggle {
      font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 500;
      background: none; border: none; text-decoration: underline;
    }

    /* Self-assign task button */
    .self-assign-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px; background: var(--primary);
      color: white; border: none; border-radius: 12px; font-size: 14px;
      font-weight: 600; cursor: pointer; margin-bottom: 16px;
    }
    .self-assign-btn:hover { background: var(--primary-light); }
    .assign-project-btn {
      padding: 6px 12px; background: var(--primary); color: white; border: none;
      border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
      white-space: nowrap;
    }
    .assign-project-btn:hover { background: var(--primary-light); }

    .text-sm { font-size: 13px; }
    .text-muted { color: var(--text-light); }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mb-8 { margin-bottom: 8px; }
    .fw-600 { font-weight: 600; }

    /* Mobile Optimierungen */
    @media (max-width: 400px) {
      .app-header h1 { font-size: 16px; }
      .app-header .user-info { font-size: 11px; }
      .header-link { font-size: 11px; padding: 5px 8px; }
      .app-header-top > div:last-child { gap: 4px !important; flex-wrap: wrap; justify-content: flex-end; }
      .card { padding: 12px; }
      .task-meta { gap: 6px; }
      .task-meta-item { font-size: 10px; padding: 2px 6px; }
      .btn { padding: 8px 14px; font-size: 13px; }
      .btn-sm { padding: 6px 10px; font-size: 12px; }
      .form-control { font-size: 14px; padding: 8px 10px; }
      .week-nav-btn { padding: 6px 10px; font-size: 13px; }
      .week-nav-label { font-size: 14px; }
      .daily-report-btn { font-size: 14px; padding: 12px; }
    }

    /* Safe area für Geräte mit Notch/Home-Indicator */
    .bottom-nav {
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .page { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0)); }

    /* Touch-Optimierungen */
    .nav-item { min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn, .toggle-option, .photo-add { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    input, select, textarea { font-size: 16px !important; } /* Verhindert iOS-Zoom beim Fokus */
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-logo">&#128274;</div>
    <div class="login-title">ATC Produktion</div>
    <div class="login-subtitle">Mitarbeiter-App</div>
    <div class="login-card">
      <form onsubmit="event.preventDefault(); doLogin();">
        <label>Email-Adresse</label>
        <input type="email" id="login-email" placeholder="ihre.email@firma.de" autocomplete="email" style="text-align: center; margin-bottom: 20px;">
        <label>PIN</label>
        <input type="password" id="login-pin" placeholder="PIN eingeben" inputmode="numeric" maxlength="10" style="text-align: center; letter-spacing: 6px;">
        <div id="login-error" style="color: #e74c3c; font-size: 13px; margin-bottom: 12px; display: none;">Falscher PIN. Bitte erneut versuchen.</div>
        <button type="submit" class="login-btn">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" style="display: none;">
    <div class="app-header">
      <div class="app-header-top">
        <div>
          <h1>ATC Produktion</h1>
          <div class="user-info" id="user-display"></div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button onclick="doLogout()" style="background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;">Abmelden</button>
        </div>
      </div>
    </div>

    <!-- Pages -->
    <div class="page active" id="page-today">
      <div class="date-header" id="today-date"></div>
      <button class="daily-report-btn" onclick="openDailyReportModal()">
        <span class="report-icon">&#128221;</span> Tagesbericht erstellen
      </button>
      <button class="self-assign-btn" onclick="openSelfAssignModal()">
        <span>&#10133;</span> Aufgabe &uuml;bernehmen
      </button>
      <div id="today-tasks"></div>
    </div>

    <div class="page" id="page-week">
      <div class="date-header">Wochenansicht</div>
      <div id="week-view-container"></div>
    </div>

    <div class="page" id="page-overview">
      <div class="date-header">Projekt&uuml;bersicht</div>
      <div id="overview-projects"></div>
    </div>

    <div class="page" id="page-report">
      <div class="date-header">Tagesbericht erstellen</div>
      <div id="report-form-container"></div>
    </div>

    <div class="page" id="page-history">
      <div class="date-header">Meine Berichte</div>
      <div id="history-list"></div>
    </div>

    <div class="page" id="page-settings">
      <div class="date-header">Einstellungen</div>
      <div class="card">
        <div class="fw-600 mb-8">PIN &auml;ndern</div>
        <div class="text-sm text-muted mb-8">Hier k&ouml;nnen Sie Ihre Login-PIN f&uuml;r die Mitarbeiter-App &auml;ndern.</div>
        <form onsubmit="changeMyPin(event)">
          <div class="form-group">
            <label>Aktuelle PIN</label>
            <input type="password" class="form-control" id="my-pin-old" required inputmode="numeric" maxlength="10" placeholder="Aktuelle PIN" style="letter-spacing: 4px; text-align: center;">
          </div>
          <div class="form-group">
            <label>Neue PIN</label>
            <input type="password" class="form-control" id="my-pin-new" required inputmode="numeric" maxlength="10" placeholder="Neue PIN" style="letter-spacing: 4px; text-align: center;">
          </div>
          <div class="form-group">
            <label>Neue PIN best&auml;tigen</label>
            <input type="password" class="form-control" id="my-pin-confirm" required inputmode="numeric" maxlength="10" placeholder="PIN wiederholen" style="letter-spacing: 4px; text-align: center;">
          </div>
          <div id="my-pin-msg" class="text-sm mb-8" style="display: none;"></div>
          <button type="submit" class="btn btn-primary btn-block">PIN &auml;ndern</button>
        </form>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" data-page="today">
        <span class="nav-icon">&#128197;</span>Heute
      </div>
      <div class="nav-item" data-page="week">
        <span class="nav-icon">&#128198;</span>Woche
      </div>
      <div class="nav-item" data-page="overview">
        <span class="nav-icon">&#128202;</span>&Uuml;bersicht
      </div>
      <div class="nav-item" data-page="history">
        <span class="nav-icon">&#128214;</span>Verlauf
      </div>
      <div class="nav-item" data-page="settings">
        <span class="nav-icon">&#9881;</span>PIN
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script>
    let currentEmployee = null;
    let reportPhotos = [];
    let selectedReportDate = null;

    // ---- LOGIN ----
    function initLogin() {
      // Check if already logged in (session-based)
      const emp = Auth.getLoggedInEmployee();
      if (emp) {
        currentEmployee = emp;
        showApp();
        return;
      }
      // Restore last used email
      const lastEmail = localStorage.getItem('atc_last_email');
      if (lastEmail) document.getElementById('login-email').value = lastEmail;
      document.getElementById('login-screen').style.display = 'flex';
    }

    function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pin = document.getElementById('login-pin').value;
      const errorEl = document.getElementById('login-error');

      if (!email) {
        errorEl.textContent = 'Bitte Email-Adresse eingeben.';
        errorEl.style.display = 'block';
        return;
      }
      if (!pin) {
        errorEl.textContent = 'Bitte PIN eingeben.';
        errorEl.style.display = 'block';
        return;
      }

      const result = Auth.loginEmployee(email, pin);
      if (result) {
        currentEmployee = result;
        localStorage.setItem('atc_last_email', email);
        errorEl.style.display = 'none';
        showApp();
      } else {
        errorEl.textContent = 'Email oder PIN falsch. Bitte erneut versuchen.';
        errorEl.style.display = 'block';
        document.getElementById('login-pin').value = '';
        document.getElementById('login-pin').focus();
      }
    }

    function doLogout() {
      Auth.logoutEmployee();
      currentEmployee = null;
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('login-pin').value = '';
      document.getElementById('login-error').style.display = 'none';
    }

    function showApp() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-display').textContent = currentEmployee.name + ' | ' + currentEmployee.email;
      renderToday();
    }

    // ---- NAVIGATION ----
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        item.classList.add('active');
        const page = item.dataset.page;
        document.getElementById('page-' + page).classList.add('active');

        switch (page) {
          case 'today': renderToday(); break;
          case 'week': renderWeekView(); break;
          case 'overview': renderOverview(); break;
          case 'report': renderReportForm(); break;
          case 'history': renderHistory(); break;
        }
      });
    });

    // ---- TODAY ----
    function renderToday() {
      const today = new Date();
      const isoDate = getISODate(today);
      document.getElementById('today-date').textContent = formatDate(today);

      const kw = getKW(today);
      const year = today.getFullYear();
      const dayOfWeek = (today.getDay() + 6) % 7; // 0=Mo, 4=Fr

      const plan = Storage.getWeekPlan(year, kw);
      const myTasks = [];
      plan.forEach((t, planIdx) => {
        if (t.employeeId === currentEmployee.id && (t.day === dayOfWeek || t.day === 'week')) {
          myTasks.push({ ...t, _planIndex: planIdx });
        }
      });
      const report = Storage.getDailyReport(isoDate, currentEmployee.id);

      if (myTasks.length === 0) {
        document.getElementById('today-tasks').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#9989;</div>
            <p>Keine Aufgaben f&uuml;r heute geplant.</p>
            <p class="text-sm text-muted mt-8">&Uuml;bernehmen Sie eine Aufgabe &uuml;ber den Button oben oder die Projekt&uuml;bersicht.</p>
          </div>
        `;
        return;
      }

      const projects = Storage.getProjects();
      let html = '';

      myTasks.forEach((task, taskIdx) => {
        const proj = projects.find(p => p.id === task.projectId);
        const isReported = !!report;
        const taskPhotos = TaskPhotos.getPhotos(currentEmployee.id, isoDate, task.projectId);
        html += `
          <div class="card task-card ${isReported ? 'completed' : ''}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div class="task-title">${proj ? escapeHtml(proj.article) : 'Unbekanntes Projekt'}</div>
                <div class="task-subtitle">${proj ? getCustomerName(proj.customerId) : ''}</div>
              </div>
              ${isReported
                ? '<span class="badge badge-success">Berichtet</span>'
                : '<span class="badge badge-warning">Offen</span>'
              }
            </div>
            <div class="task-meta">
              <span class="task-meta-item">${escapeHtml(task.area)}</span>
              ${task.day === 'week' ? '<span class="task-meta-item" style="background:#d6eaf8; color:#2980b9;">Wochenaufgabe Mo-Fr</span>' : ''}
              ${task.plannedQty ? `<span class="task-meta-item">${task.plannedQty} Stk. geplant</span>` : ''}
              ${task.plannedMinutes ? `<span class="task-meta-item" style="background:#fdebd0;">Soll: ${task.plannedMinutes} Min</span>` : ''}
              ${task.targetProgress !== undefined ? `<span class="task-meta-item">Ziel: ${Math.round(task.targetProgress * 100)}%</span>` : ''}
            </div>
            ${task.workStepId ? (() => {
              const pSteps = Storage.getProjectSteps(task.projectId);
              const ws = pSteps.find(s => s.id === task.workStepId);
              return ws ? `<div class="mt-8" style="background:#eaf2f8; border-radius:6px; padding:8px 10px;">
                <div class="fw-600 text-sm" style="color:var(--primary);">Arbeitsschritt #${ws.order}: ${escapeHtml(ws.name)}</div>
                ${ws.description ? `<div class="text-sm text-muted">${escapeHtml(ws.description)}</div>` : ''}
                <div class="text-sm mt-8">
                  <span>Soll: ${ws.plannedDuration} Min/Stk</span>
                  ${ws.dryingTime > 0 ? ` | <span style="color:var(--warning);">Trockenzeit: ${ws.dryingTime} Min</span>` : ''}
                  | <span>Fertig: ${ws.completedQty}/${ws.totalQty} Stk</span>
                </div>
              </div>` : '';
            })() : ''}
            <div class="mt-8">
              <div class="fw-600 text-sm">Aufgabe:</div>
              <div class="text-sm">${escapeHtml(task.description)}</div>
            </div>
            ${proj ? `
              <div class="mt-8">
                <div class="text-sm text-muted">Aktueller Fortschritt ${escapeHtml(task.area)}:</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${Math.round((proj[task.area] || 0) * 100)}%; background: ${getProgressColor(proj[task.area] || 0)};"></div>
                </div>
                <div class="text-sm text-muted mt-8">${getProgressLabel(task.area, proj[task.area] || 0)}</div>
              </div>
            ` : ''}

            <!-- Fotos zur Aufgabe -->
            <div class="mt-8" style="border-top: 1px solid var(--border); padding-top: 8px;">
              <div class="fw-600 text-sm mb-8">Fotos zur Dokumentation (${taskPhotos.length})</div>
              <div class="photo-upload" id="task-photos-${task.projectId}">
                ${taskPhotos.map((ph, i) => `<img src="${ph.data}" class="photo-preview" onclick="removeTaskPhoto(${task.projectId}, ${i})" title="Tippen zum Entfernen">`).join('')}
                <label class="photo-add" for="task-photo-input-${task.projectId}">+</label>
              </div>
              <input type="file" id="task-photo-input-${task.projectId}" accept="image/*" capture="environment" multiple style="display:none;" onchange="addTaskPhoto(event, ${task.projectId})">
              <div class="text-sm text-muted mt-8">Fotos mit der Kamera aufnehmen oder aus Galerie w&auml;hlen</div>
            </div>

            ${!isReported ? `
              <div class="task-actions">
                <button class="btn btn-accent btn-sm" data-desc="${escapeHtml(task.description)}" onclick="goToReport(${task.projectId}, '${task.area}', this.dataset.desc, ${task.plannedQty || 0})">
                  Bericht erstellen
                </button>
                <button class="btn btn-outline btn-sm" style="color: var(--danger); border-color: var(--danger);" onclick="removeSelfAssignedTask(${task._planIndex})">
                  Entfernen
                </button>
              </div>
            ` : ''}
          </div>
        `;
      });

      document.getElementById('today-tasks').innerHTML = html;
    }

    // ---- OVERVIEW ----
    function renderOverview() {
      const projects = Storage.getProjects();
      let html = '';

      projects.forEach(p => {
        const avg = ((p.konstruktion + p.fertigung + p.montage) / 3);
        html += `
          <div class="card project-overview-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div class="fw-600">${escapeHtml(p.article)}</div>
                <div class="text-sm text-muted">${getCustomerName(p.customerId)}</div>
              </div>
              <div class="text-right">
                <div class="fw-600">${p.quantity} ${p.unit}</div>
              </div>
            </div>
            <div class="project-progress">
              <div class="progress-item">
                <div class="label">Konstruktion</div>
                <div class="value" style="color: ${getProgressColor(p.konstruktion)}">${Math.round(p.konstruktion * 100)}%</div>
              </div>
              <div class="progress-item">
                <div class="label">Fertigung</div>
                <div class="value" style="color: ${getProgressColor(p.fertigung)}">${Math.round(p.fertigung * 100)}%</div>
              </div>
              <div class="progress-item">
                <div class="label">Montage</div>
                <div class="value" style="color: ${getProgressColor(p.montage)}">${Math.round(p.montage * 100)}%</div>
              </div>
            </div>
            <div class="progress-bar mt-8">
              <div class="progress-fill" style="width: ${Math.round(avg * 100)}%; background: ${getProgressColor(avg)};"></div>
            </div>
            <div class="text-sm text-muted mt-8">Gesamt: ${Math.round(avg * 100)}%</div>
            ${p.remarks ? `<div class="text-sm mt-8" style="color: var(--accent);">${escapeHtml(p.remarks)}</div>` : ''}
            <div class="mt-12" style="border-top: 1px solid var(--border); padding-top: 10px;">
              <button class="assign-project-btn" onclick="openSelfAssignModal(${p.id})">
                &#10133; Aufgabe f&uuml;r dieses Projekt &uuml;bernehmen
              </button>
            </div>
          </div>
        `;
      });

      document.getElementById('overview-projects').innerHTML = html;
    }

    // ---- REPORT ----
    function goToReport(projectId, area, description, plannedQty, reportDate) {
      selectedReportDate = reportDate || getISODate(new Date());
      // Switch to report tab
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-page="report"]').classList.add('active');
      document.getElementById('page-report').classList.add('active');

      renderReportForm(null, null, null, 0, projectId);
    }

    function renderReportForm(unused1, unused2, unused3, unused4, highlightProjectId) {
      const today = selectedReportDate || getISODate(new Date());
      const reportDateObj = new Date(today + 'T12:00:00');
      const existingReport = Storage.getDailyReport(today, currentEmployee.id);
      const projects = Storage.getProjects();

      // Gather tasks from week plan for this day
      const kw = getKW(reportDateObj);
      const year = reportDateObj.getFullYear();
      const dayOfWeek = (reportDateObj.getDay() + 6) % 7;
      const plan = Storage.getWeekPlan(year, kw);
      const myTasks = plan.filter(t => t.employeeId === currentEmployee.id && (t.day === dayOfWeek || t.day === 'week'));

      // Build report entries: merge existing saved entries with planned tasks
      let entries = [];
      if (existingReport && existingReport.entries && existingReport.entries.length > 0) {
        entries = existingReport.entries.map(e => ({ ...e }));
        // Add any new planned tasks not already in report
        myTasks.forEach(task => {
          const already = entries.find(e => e.projectId === task.projectId && e.area === task.area);
          if (!already) {
            entries.push({
              projectId: task.projectId,
              area: task.area,
              taskDescription: task.description || '',
              plannedMinutes: task.plannedMinutes || 0,
              plannedQty: task.plannedQty || 0,
              workStepId: task.workStepId || null,
              actualMinutes: 0,
              completedQty: 0,
              completedWork: '',
              deviation: false,
              deviationReason: '',
              achievedProgress: 0
            });
          }
        });
      } else if (existingReport && !existingReport.entries) {
        // Legacy single-entry report: convert to array
        entries.push({
          projectId: existingReport.projectId,
          area: existingReport.area || 'fertigung',
          taskDescription: existingReport.taskDescription || '',
          plannedMinutes: 0,
          plannedQty: 0,
          workStepId: null,
          actualMinutes: existingReport.actualMinutes || 0,
          completedQty: existingReport.completedQty || 0,
          completedWork: existingReport.completedWork || '',
          deviation: existingReport.deviation || false,
          deviationReason: existingReport.deviationReason || '',
          achievedProgress: existingReport.achievedProgress || 0
        });
      } else {
        // New report: build from planned tasks
        myTasks.forEach(task => {
          entries.push({
            projectId: task.projectId,
            area: task.area,
            taskDescription: task.description || '',
            plannedMinutes: task.plannedMinutes || 0,
            plannedQty: task.plannedQty || 0,
            workStepId: task.workStepId || null,
            actualMinutes: 0,
            completedQty: 0,
            completedWork: '',
            deviation: false,
            deviationReason: '',
            achievedProgress: 0
          });
        });
      }

      // If no tasks at all, add one empty entry
      if (entries.length === 0) {
        entries.push({
          projectId: projects.length > 0 ? projects[0].id : 0,
          area: 'fertigung',
          taskDescription: '',
          plannedMinutes: 0,
          plannedQty: 0,
          workStepId: null,
          actualMinutes: 0,
          completedQty: 0,
          completedWork: '',
          deviation: false,
          deviationReason: '',
          achievedProgress: 0
        });
      }

      // Store entries globally for reference
      window._reportEntries = entries;

      // General notes
      const generalNotes = existingReport?.generalNotes || '';

      const projOptions = projects.map(p =>
        `<option value="${p.id}">${escapeHtml(p.article)} (${getCustomerName(p.customerId)})</option>`
      ).join('');

      let html = `
        <div class="card">
          <div class="fw-600 mb-8" style="font-size:17px;">Tagesbericht</div>
          <div class="report-date-picker" style="margin-bottom: 12px;">
            <label>Datum:</label>
            <input type="date" id="rpt-date" value="${today}" onchange="selectedReportDate = this.value; renderReportForm();">
          </div>
          ${existingReport ? '<div class="badge badge-success mb-8" style="padding:6px 12px;">Bericht bereits vorhanden &ndash; wird aktualisiert</div>' : ''}
      `;

      entries.forEach((entry, idx) => {
        const proj = projects.find(p => p.id === entry.projectId);
        const projName = proj ? escapeHtml(proj.article) : 'Projekt';
        const isHighlighted = highlightProjectId && entry.projectId === parseInt(highlightProjectId);
        const timeDiff = entry.actualMinutes - (entry.plannedMinutes || 0);
        const hasTimeDiff = entry.plannedMinutes > 0 && entry.actualMinutes > 0;
        const timeDiffColor = timeDiff > 0 ? 'var(--danger)' : timeDiff < 0 ? 'var(--success)' : 'var(--text)';
        const timeDiffLabel = timeDiff > 0 ? '+' + timeDiff + ' Min' : timeDiff < 0 ? timeDiff + ' Min' : '\u00b10';

        // Build progress options for this entry's area
        const scale = ATC_DATA.progressScales[entry.area] || ATC_DATA.progressScales['fertigung'] || [];
        const progressOpts = scale.map(s =>
          `<option value="${s.value}" ${entry.achievedProgress === s.value ? 'selected' : ''}>${Math.round(s.value * 100)}% - ${escapeHtml(s.label)}</option>`
        ).join('');

        const selectedProjectOpts = projects.map(p =>
          `<option value="${p.id}" ${entry.projectId === p.id ? 'selected' : ''}>${escapeHtml(p.article)} (${getCustomerName(p.customerId)})</option>`
        ).join('');

        html += `
          <div class="report-section" id="entry-${idx}" style="border-left: 4px solid ${entry.deviation ? 'var(--danger)' : 'var(--primary)'}; padding-left: 12px; margin-left: -12px;${isHighlighted ? ' background: #eaf2f8; border-radius: 8px; padding: 12px; margin: 12px -12px;' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <div class="fw-600" style="font-size:15px;">${idx + 1}. ${projName}</div>
              ${entries.length > 1 ? `<button class="btn btn-outline btn-sm" style="color:var(--danger); border-color:var(--danger); padding:4px 8px; font-size:11px;" onclick="removeReportEntry(${idx})">&times; Entfernen</button>` : ''}
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
              <div class="form-group" style="margin-bottom:0;">
                <label>Projekt</label>
                <select class="form-control" id="rpt-project-${idx}" onchange="updateEntryArea(${idx})">${selectedProjectOpts}</select>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Bereich</label>
                <select class="form-control" id="rpt-area-${idx}" onchange="updateEntryProgressScale(${idx})">
                  <option value="konstruktion" ${entry.area === 'konstruktion' ? 'selected' : ''}>Konstruktion</option>
                  <option value="fertigung" ${entry.area === 'fertigung' ? 'selected' : ''}>Fertigung</option>
                  <option value="montage" ${entry.area === 'montage' ? 'selected' : ''}>Montage</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Geplante Aufgabe</label>
              <textarea class="form-control" id="rpt-task-${idx}" rows="1" placeholder="Was war geplant?">${escapeHtml(entry.taskDescription)}</textarea>
            </div>

            <div class="form-group">
              <label>Beschreibung der erledigten Arbeit *</label>
              <textarea class="form-control" id="rpt-completed-${idx}" rows="2" placeholder="Was wurde erledigt?">${escapeHtml(entry.completedWork)}</textarea>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px;">
              <div class="form-group" style="margin-bottom:0;">
                <label>Soll-Zeit (Min)</label>
                <input type="number" class="form-control" id="rpt-planned-min-${idx}" value="${entry.plannedMinutes || ''}" min="0" placeholder="Plan" onchange="updateTimeDiff(${idx})" style="background:#f8f9fa;">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Ist-Zeit (Min) *</label>
                <input type="number" class="form-control" id="rpt-actual-min-${idx}" value="${entry.actualMinutes || ''}" min="0" placeholder="Ist" onchange="updateTimeDiff(${idx})">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Abweichung</label>
                <div id="rpt-diff-${idx}" class="form-control" style="text-align:center; font-weight:700;${hasTimeDiff ? ' color:' + timeDiffColor : ' color:var(--text-light)'}; background:#f8f9fa; border:1px solid var(--border);">
                  ${hasTimeDiff ? timeDiffLabel : '&mdash;'}
                </div>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
              <div class="form-group" style="margin-bottom:0;">
                <label>Erledigte St&uuml;ckzahl</label>
                <input type="number" class="form-control" id="rpt-qty-${idx}" value="${entry.completedQty || ''}" min="0" placeholder="0">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label>Erreichter Fortschritt</label>
                <select class="form-control" id="rpt-progress-${idx}">${progressOpts}</select>
              </div>
            </div>

            <div style="margin-bottom:8px;">
              <div class="toggle-group" style="margin-bottom:0;">
                <button type="button" class="toggle-option ${!entry.deviation ? 'active-yes' : ''}" onclick="setEntryDeviation(${idx}, false)">Plan erf&uuml;llt</button>
                <button type="button" class="toggle-option ${entry.deviation ? 'active-no' : ''}" onclick="setEntryDeviation(${idx}, true)">Abweichung</button>
              </div>
            </div>
            <div id="rpt-deviation-section-${idx}" style="display:${entry.deviation ? 'block' : 'none'};">
              <div class="form-group">
                <label>Begr&uuml;ndung der Abweichung *</label>
                <textarea class="form-control" id="rpt-deviation-${idx}" rows="2" placeholder="Warum konnte die Aufgabe nicht planm&auml;&szlig;ig erledigt werden?">${escapeHtml(entry.deviationReason)}</textarea>
              </div>
            </div>
          </div>
        `;
      });

      // Add new entry button
      html += `
          <div style="margin-top:12px; margin-bottom:16px;">
            <button class="btn btn-outline btn-block" onclick="addReportEntry()" style="border-style:dashed;">
              + Weitere Aufgabe hinzuf&uuml;gen
            </button>
          </div>

          <div class="report-section">
            <div class="fw-600 mb-8">Allgemeine Anmerkungen zum Tag</div>
            <textarea class="form-control" id="rpt-general-notes" rows="2" placeholder="Optionale Gesamtanmerkungen zum Arbeitstag...">${escapeHtml(generalNotes)}</textarea>
          </div>

          <div class="report-section">
            <div class="fw-600 mb-8">Fotos</div>
            <div class="photo-upload" id="photo-container">
              ${reportPhotos.map((ph, i) => `<img src="${ph}" class="photo-preview" onclick="removePhoto(${i})">`).join('')}
              <label class="photo-add" for="photo-input">+</label>
            </div>
            <input type="file" id="photo-input" accept="image/*" capture="environment" multiple style="display:none;" onchange="handlePhotos(event)">
            <div class="text-sm text-muted mt-8">Tippen Sie auf + um Fotos hinzuzuf&uuml;gen.</div>
          </div>

          <div class="mt-12">
            <button class="btn btn-success btn-block" onclick="submitReport()" style="padding:14px; font-size:15px;">
              ${existingReport ? 'Bericht aktualisieren' : 'Bericht einreichen'}
            </button>
          </div>
        </div>
      `;

      document.getElementById('report-form-container').innerHTML = html;

      // Merge task photos into reportPhotos
      if (!existingReport) {
        reportPhotos = [];
        entries.forEach(entry => {
          if (entry.projectId) {
            const taskPhotoData = TaskPhotos.getPhotos(currentEmployee.id, today, entry.projectId);
            taskPhotoData.forEach(p => {
              const url = p.data || p;
              if (!reportPhotos.includes(url)) reportPhotos.push(url);
            });
          }
        });
      } else {
        reportPhotos = existingReport.photos || [];
      }
      updatePhotoDisplay();

      // Scroll to highlighted entry if any
      if (highlightProjectId) {
        const highlightIdx = entries.findIndex(e => e.projectId === parseInt(highlightProjectId));
        if (highlightIdx >= 0) {
          setTimeout(() => {
            const el = document.getElementById('entry-' + highlightIdx);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }
      }
    }

    function addReportEntry() {
      collectReportEntries();
      const projects = Storage.getProjects();
      window._reportEntries.push({
        projectId: projects.length > 0 ? projects[0].id : 0,
        area: 'fertigung',
        taskDescription: '',
        plannedMinutes: 0,
        plannedQty: 0,
        workStepId: null,
        actualMinutes: 0,
        completedQty: 0,
        completedWork: '',
        deviation: false,
        deviationReason: '',
        achievedProgress: 0
      });
      renderReportForm();
    }

    function removeReportEntry(idx) {
      collectReportEntries();
      window._reportEntries.splice(idx, 1);
      renderReportForm();
    }

    function collectReportEntries() {
      if (!window._reportEntries) return;
      window._reportEntries.forEach((entry, idx) => {
        const projEl = document.getElementById('rpt-project-' + idx);
        const areaEl = document.getElementById('rpt-area-' + idx);
        const taskEl = document.getElementById('rpt-task-' + idx);
        const completedEl = document.getElementById('rpt-completed-' + idx);
        const plannedMinEl = document.getElementById('rpt-planned-min-' + idx);
        const actualMinEl = document.getElementById('rpt-actual-min-' + idx);
        const qtyEl = document.getElementById('rpt-qty-' + idx);
        const progressEl = document.getElementById('rpt-progress-' + idx);
        const deviationEl = document.getElementById('rpt-deviation-' + idx);

        if (projEl) entry.projectId = parseInt(projEl.value);
        if (areaEl) entry.area = areaEl.value;
        if (taskEl) entry.taskDescription = taskEl.value;
        if (completedEl) entry.completedWork = completedEl.value;
        if (plannedMinEl) entry.plannedMinutes = parseInt(plannedMinEl.value) || 0;
        if (actualMinEl) entry.actualMinutes = parseInt(actualMinEl.value) || 0;
        if (qtyEl) entry.completedQty = parseInt(qtyEl.value) || 0;
        if (progressEl) entry.achievedProgress = parseFloat(progressEl.value) || 0;
        if (deviationEl) entry.deviationReason = deviationEl.value;
      });
    }

    function updateTimeDiff(idx) {
      const planned = parseInt(document.getElementById('rpt-planned-min-' + idx).value) || 0;
      const actual = parseInt(document.getElementById('rpt-actual-min-' + idx).value) || 0;
      const diffEl = document.getElementById('rpt-diff-' + idx);
      if (planned > 0 && actual > 0) {
        const diff = actual - planned;
        const color = diff > 0 ? 'var(--danger)' : diff < 0 ? 'var(--success)' : 'var(--text)';
        const label = diff > 0 ? '+' + diff + ' Min' : diff < 0 ? diff + ' Min' : '\u00b10';
        diffEl.innerHTML = label;
        diffEl.style.color = color;
      } else {
        diffEl.innerHTML = '&mdash;';
        diffEl.style.color = 'var(--text-light)';
      }
    }

    function setEntryDeviation(idx, val) {
      if (window._reportEntries && window._reportEntries[idx]) {
        window._reportEntries[idx].deviation = val;
      }
      const section = document.getElementById('rpt-deviation-section-' + idx);
      if (section) section.style.display = val ? 'block' : 'none';
      const parent = document.getElementById('entry-' + idx);
      if (parent) parent.style.borderLeftColor = val ? 'var(--danger)' : 'var(--primary)';
      // Toggle button states
      const toggles = parent ? parent.querySelectorAll('.toggle-option') : [];
      toggles.forEach(t => t.classList.remove('active-yes', 'active-no'));
      if (toggles.length >= 2) {
        if (val) toggles[1].classList.add('active-no');
        else toggles[0].classList.add('active-yes');
      }
    }

    function updateEntryArea(idx) {
      collectReportEntries();
      renderReportForm();
    }

    function updateEntryProgressScale(idx) {
      const area = document.getElementById('rpt-area-' + idx).value;
      const sel = document.getElementById('rpt-progress-' + idx);
      if (!sel) return;
      const scale = ATC_DATA.progressScales[area] || [];
      sel.innerHTML = scale.map(s =>
        `<option value="${s.value}">${Math.round(s.value * 100)}% - ${escapeHtml(s.label)}</option>`
      ).join('');
    }

    let hasDeviation = false;

    function setDeviation(val) {
      hasDeviation = val;
      document.querySelectorAll('.toggle-option').forEach(o => {
        o.classList.remove('active-yes', 'active-no');
      });
      const toggles = document.querySelectorAll('.toggle-option');
      if (val) {
        toggles[1].classList.add('active-no');
      } else {
        toggles[0].classList.add('active-yes');
      }
      const section = document.getElementById('deviation-section');
      if (section) section.style.display = val ? 'block' : 'none';
    }

    function updateReportProgress(area) {
      const sel = document.getElementById('rpt-progress');
      if (!sel) return;
      const scale = ATC_DATA.progressScales[area] || [];
      sel.innerHTML = scale.map(s =>
        `<option value="${s.value}">${Math.round(s.value * 100)}% - ${escapeHtml(s.label)}</option>`
      ).join('');
    }

    function handlePhotos(event) {
      const files = event.target.files;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          // Resize image for storage
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxSize = 800;
            let w = img.width, h = img.height;
            if (w > maxSize || h > maxSize) {
              if (w > h) { h = (h / w) * maxSize; w = maxSize; }
              else { w = (w / h) * maxSize; h = maxSize; }
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            reportPhotos.push(canvas.toDataURL('image/jpeg', 0.7));
            updatePhotoDisplay();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function removePhoto(index) {
      if (confirm('Foto entfernen?')) {
        reportPhotos.splice(index, 1);
        updatePhotoDisplay();
      }
    }

    function updatePhotoDisplay() {
      const container = document.getElementById('photo-container');
      container.innerHTML = reportPhotos.map((ph, i) =>
        `<img src="${ph}" class="photo-preview" onclick="removePhoto(${i})">`
      ).join('') + '<label class="photo-add" for="photo-input">+</label>';
    }

    function submitReport() {
      collectReportEntries();
      const entries = window._reportEntries || [];

      // Validate all entries
      for (let i = 0; i < entries.length; i++) {
        if (!entries[i].completedWork || !entries[i].completedWork.trim()) {
          alert('Bitte beschreiben Sie bei Aufgabe ' + (i + 1) + ', was erledigt wurde.');
          const el = document.getElementById('rpt-completed-' + i);
          if (el) el.focus();
          return;
        }
        if (entries[i].deviation && (!entries[i].deviationReason || !entries[i].deviationReason.trim())) {
          alert('Bitte begr\u00fcnden Sie die Abweichung bei Aufgabe ' + (i + 1) + '.');
          const el = document.getElementById('rpt-deviation-' + i);
          if (el) el.focus();
          return;
        }
      }

      const reportDate = document.getElementById('rpt-date') ? document.getElementById('rpt-date').value : getISODate(new Date());
      const generalNotes = document.getElementById('rpt-general-notes') ? document.getElementById('rpt-general-notes').value.trim() : '';

      // Build report object (new multi-entry format)
      const report = {
        entries: entries.map(e => ({
          projectId: e.projectId,
          area: e.area,
          taskDescription: e.taskDescription,
          completedWork: e.completedWork,
          completedQty: e.completedQty,
          plannedMinutes: e.plannedMinutes,
          actualMinutes: e.actualMinutes,
          achievedProgress: e.achievedProgress,
          deviation: e.deviation,
          deviationReason: e.deviation ? e.deviationReason : '',
          workStepId: e.workStepId || null,
        })),
        generalNotes: generalNotes,
        photos: reportPhotos,
        submittedAt: new Date().toISOString(),
        // Keep backward-compatible fields from first entry
        projectId: entries[0].projectId,
        area: entries[0].area,
        taskDescription: entries[0].taskDescription,
        completedWork: entries[0].completedWork,
        completedQty: entries[0].completedQty,
        actualMinutes: entries.reduce((sum, e) => sum + (e.actualMinutes || 0), 0),
        achievedProgress: entries[0].achievedProgress,
        deviation: entries.some(e => e.deviation),
        deviationReason: entries.filter(e => e.deviation).map(e => e.deviationReason).join('; '),
      };

      Storage.saveDailyReport(reportDate, currentEmployee.id, report);

      // Update project progress and work steps for each entry
      const projects = Storage.getProjects();
      const reportDateObj = new Date(reportDate + 'T12:00:00');
      const kw = getKW(reportDateObj);
      const year = reportDateObj.getFullYear();
      const dayOfWeek = (reportDateObj.getDay() + 6) % 7;
      const weekPlan = Storage.getWeekPlan(year, kw);
      let projectsChanged = false;
      let weekPlanChanged = false;

      entries.forEach(entry => {
        // Update project progress
        const proj = projects.find(p => p.id === entry.projectId);
        if (proj && entry.achievedProgress > proj[entry.area]) {
          proj[entry.area] = entry.achievedProgress;
          projectsChanged = true;
        }

        // Update work step
        const myTask = weekPlan.find(t => t.employeeId === currentEmployee.id
          && t.projectId === entry.projectId
          && (t.day === dayOfWeek || t.day === 'week')
          && t.workStepId);
        if (myTask && myTask.workStepId) {
          const pSteps = Storage.getProjectSteps(entry.projectId);
          const step = pSteps.find(s => s.id === myTask.workStepId);
          if (step) {
            step.actualDuration = (step.actualDuration || 0) + (entry.actualMinutes || 0);
            step.completedQty = Math.max(step.completedQty || 0, entry.completedQty);
            if (step.completedQty >= step.totalQty) {
              step.status = 'abgeschlossen';
            } else if (step.completedQty > 0 || entry.actualMinutes > 0) {
              step.status = 'in_bearbeitung';
            }
            Storage.saveProjectSteps(entry.projectId, pSteps);
          }
          myTask.actualMinutes = (myTask.actualMinutes || 0) + (entry.actualMinutes || 0);
          weekPlanChanged = true;
        }

        // Email notification for deviations
        if (entry.deviation && proj) {
          Notify.notifyDeviationToAdmin(
            currentEmployee.name,
            proj.article,
            entry.deviationReason,
            formatDate(reportDateObj)
          );
        }
      });

      if (projectsChanged) Storage.saveProjects(projects);
      if (weekPlanChanged) Storage.saveWeekPlan(year, kw, weekPlan);

      alert('Bericht erfolgreich gespeichert!');

      // Go back to today
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-page="today"]').classList.add('active');
      document.getElementById('page-today').classList.add('active');
      renderToday();
    }

    // ---- HISTORY ----
    function renderHistory() {
      const today = new Date();
      const projects = Storage.getProjects();
      let html = '';
      let hasAny = false;

      // Show last 30 days
      for (let i = 0; i < 30; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const iso = getISODate(d);
        const report = Storage.getDailyReport(iso, currentEmployee.id);

        if (report) {
          hasAny = true;
          const hasEntries = report.entries && report.entries.length > 0;
          const anyDeviation = hasEntries ? report.entries.some(e => e.deviation) : report.deviation;
          const totalActual = hasEntries ? report.entries.reduce((s, e) => s + (e.actualMinutes || 0), 0) : (report.actualMinutes || 0);
          const totalPlanned = hasEntries ? report.entries.reduce((s, e) => s + (e.plannedMinutes || 0), 0) : 0;

          html += `
            <div class="card" style="border-left: 4px solid ${anyDeviation ? 'var(--danger)' : 'var(--success)'};">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <div class="fw-600">${formatDate(d)}</div>
                  <div class="text-sm text-muted">
                    ${hasEntries ? report.entries.length + ' Aufgabe' + (report.entries.length > 1 ? 'n' : '') : '1 Aufgabe'}
                    ${totalActual > 0 ? ' &middot; ' + totalActual + ' Min Ist' : ''}
                    ${totalPlanned > 0 ? ' / ' + totalPlanned + ' Min Soll' : ''}
                  </div>
                </div>
                <div style="display:flex; gap:6px; align-items:center;">
                  <span class="badge ${anyDeviation ? 'badge-danger' : 'badge-success'}">${anyDeviation ? 'Abweichung' : 'OK'}</span>
                </div>
              </div>
          `;

          if (hasEntries) {
            report.entries.forEach((entry, eIdx) => {
              const proj = projects.find(p => p.id === entry.projectId);
              const timeDiff = (entry.actualMinutes || 0) - (entry.plannedMinutes || 0);
              const hasTimeDiff = (entry.plannedMinutes || 0) > 0 && (entry.actualMinutes || 0) > 0;
              const timeDiffColor = timeDiff > 0 ? 'var(--danger)' : timeDiff < 0 ? 'var(--success)' : 'var(--text)';
              const timeDiffLabel = timeDiff > 0 ? '+' + timeDiff : timeDiff < 0 ? '' + timeDiff : '\u00b10';

              html += `
                <div style="margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:8px; border-left:3px solid ${entry.deviation ? 'var(--danger)' : 'var(--primary)'};">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="fw-600 text-sm">${proj ? escapeHtml(proj.article) : 'Projekt'}</div>
                    <span class="badge badge-info" style="font-size:10px;">${escapeHtml(entry.area || '')}</span>
                  </div>
                  <div class="text-sm mt-8">${escapeHtml(entry.completedWork || '-')}</div>
                  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
                    ${entry.plannedMinutes > 0 ? `<span class="badge badge-neutral">Soll: ${entry.plannedMinutes} Min</span>` : ''}
                    ${entry.actualMinutes > 0 ? `<span class="badge badge-warning">Ist: ${entry.actualMinutes} Min</span>` : ''}
                    ${hasTimeDiff ? `<span class="badge" style="background:${timeDiff > 0 ? '#fadbd8' : '#d5f5e3'}; color:${timeDiffColor};">${timeDiffLabel} Min</span>` : ''}
                    ${entry.completedQty > 0 ? `<span class="badge badge-neutral">${entry.completedQty} Stk.</span>` : ''}
                    ${entry.achievedProgress > 0 ? `<span class="badge badge-success">${Math.round(entry.achievedProgress * 100)}%</span>` : ''}
                  </div>
                  ${entry.deviation ? `<div class="text-sm mt-8" style="color:var(--danger);"><strong>Abweichung:</strong> ${escapeHtml(entry.deviationReason || '-')}</div>` : ''}
                </div>
              `;
            });
          } else {
            // Legacy single-entry display
            const proj = report.projectId ? projects.find(p => p.id === report.projectId) : null;
            html += `
              <div class="text-sm mt-8"><strong>Projekt:</strong> ${proj ? escapeHtml(proj.article) : 'Unbekannt'} | ${escapeHtml(report.area || '')}</div>
              <div class="text-sm mt-8"><strong>Erledigt:</strong> ${escapeHtml(report.completedWork || '-')}</div>
              ${report.completedQty ? `<div class="text-sm mt-8"><strong>St&uuml;ckzahl:</strong> ${report.completedQty}</div>` : ''}
              ${report.actualMinutes ? `<div class="text-sm mt-8"><strong>Ist-Zeit:</strong> ${report.actualMinutes} Min</div>` : ''}
              ${report.deviation ? `<div class="text-sm mt-8" style="color:var(--danger);"><strong>Abweichung:</strong> ${escapeHtml(report.deviationReason || '-')}</div>` : ''}
            `;
          }

          // General notes
          if (report.generalNotes) {
            html += `<div class="text-sm mt-8" style="font-style:italic; color:var(--text-light);"><strong>Anmerkung:</strong> ${escapeHtml(report.generalNotes)}</div>`;
          }

          // Photos
          if (report.photos && report.photos.length > 0) {
            html += `
              <div class="photo-upload mt-8">
                ${report.photos.map(ph => `<img src="${ph}" class="photo-preview" style="cursor:default;">`).join('')}
              </div>
            `;
          }

          // Edit button
          html += `
              <div style="margin-top:10px; padding-top:8px; border-top:1px solid var(--border);">
                <button class="btn btn-outline btn-sm" onclick="editHistoryReport('${iso}')" style="width:100%;">
                  Bericht bearbeiten
                </button>
              </div>
            </div>
          `;
