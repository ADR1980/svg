      }

      if (!hasAny) {
        html = `
          <div class="empty-state">
            <div class="empty-icon">&#128214;</div>
            <p>Noch keine Berichte vorhanden.</p>
            <p class="text-sm text-muted mt-8">Eingereichte Berichte erscheinen hier.</p>
          </div>
        `;
      }

      document.getElementById('history-list').innerHTML = html;
    }

    function editHistoryReport(dateStr) {
      selectedReportDate = dateStr;
      // Switch to report tab
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-page="report"]').classList.add('active');
      document.getElementById('page-report').classList.add('active');
      renderReportForm();
    }

    // ---- WOCHENANSICHT ----
    let weekViewOffset = 0; // 0 = aktuelle Woche, -1 = letzte Woche, etc.

    function renderWeekView() {
      const today = new Date();
      const refDate = new Date(today);
      refDate.setDate(refDate.getDate() + weekViewOffset * 7);

      const kw = getKW(refDate);
      const year = refDate.getFullYear();
      const plan = Storage.getWeekPlan(year, kw);
      const projects = Storage.getProjects();
      const todayDayOfWeek = (today.getDay() + 6) % 7;
      const todayISO = getISODate(today);

      // Montag der Referenzwoche berechnen
      const monday = new Date(refDate);
      const currentDay = (monday.getDay() + 6) % 7;
      monday.setDate(monday.getDate() - currentDay);

      const dayNames = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];

      // Wochenaufgaben (day === 'week') sammeln
      const weekTasks = plan.filter(t => t.employeeId === currentEmployee.id && t.day === 'week');

      let html = `
        <div class="week-nav">
          <button class="week-nav-btn" onclick="weekViewOffset--; renderWeekView();">&larr;</button>
          <div class="week-nav-label">KW ${kw} / ${year}</div>
          <button class="week-nav-btn" onclick="weekViewOffset++; renderWeekView();">&rarr;</button>
        </div>
      `;

      // Wochenaufgaben-Block
      if (weekTasks.length > 0) {
        html += `<div class="week-day-card" style="margin-bottom:12px;">
          <div class="week-day-header" style="background: var(--primary-light);" onclick="toggleWeekDay(this)">
            <span>Wochenaufgaben (Mo-Fr)</span>
            <span class="day-badge">${weekTasks.length} Aufgabe${weekTasks.length > 1 ? 'n' : ''}</span>
          </div>
          <div class="week-day-body">`;
        weekTasks.forEach(task => {
          const proj = projects.find(p => p.id === task.projectId);
          html += renderWeekTaskItem(task, proj);
        });
        html += `</div></div>`;
      }

      html += '<div class="week-days">';

      for (let d = 0; d < 5; d++) {
        const dayDate = new Date(monday);
        dayDate.setDate(monday.getDate() + d);
        const dayISO = getISODate(dayDate);
        const isToday = weekViewOffset === 0 && d === todayDayOfWeek;
        const dayTasks = plan.filter(t => t.employeeId === currentEmployee.id && t.day === d);
        const report = Storage.getDailyReport(dayISO, currentEmployee.id);

        html += `
          <div class="week-day-card">
            <div class="week-day-header ${isToday ? 'today-highlight' : ''}" onclick="toggleWeekDay(this)">
              <span>${dayNames[d]}, ${dayDate.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}</span>
              <span class="day-badge">
                ${dayTasks.length} Aufgabe${dayTasks.length !== 1 ? 'n' : ''}
                ${report ? ' &#9989;' : ''}
              </span>
            </div>
            <div class="week-day-body ${!isToday ? 'collapsed' : ''}">
        `;

        if (dayTasks.length === 0) {
          html += '<div style="padding: 12px 16px; color: var(--text-light); font-size: 13px;">Keine Aufgaben geplant.</div>';
        } else {
          dayTasks.forEach(task => {
            const proj = projects.find(p => p.id === task.projectId);
            html += renderWeekTaskItem(task, proj);
          });
        }

        html += '</div></div>';
      }

      html += '</div>';

      // Heute-Button wenn nicht aktuelle Woche
      if (weekViewOffset !== 0) {
        html += `<div style="text-align:center; margin-top:16px;">
          <button class="btn btn-outline" onclick="weekViewOffset=0; renderWeekView();">Zur aktuellen Woche</button>
        </div>`;
      }

      document.getElementById('week-view-container').innerHTML = html;
    }

    function renderWeekTaskItem(task, proj) {
      return `
        <div class="week-task-item">
          <div class="week-task-info">
            <div class="week-task-title">${proj ? escapeHtml(proj.article) : 'Unbekanntes Projekt'}</div>
            <div class="week-task-desc">${escapeHtml(task.description)}</div>
            <div class="week-task-badges">
              <span class="badge badge-info">${escapeHtml(task.area)}</span>
              ${task.plannedQty ? `<span class="badge badge-neutral">${task.plannedQty} Stk.</span>` : ''}
              ${task.plannedMinutes ? `<span class="badge badge-warning">Soll: ${task.plannedMinutes} Min</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    function toggleWeekDay(headerEl) {
      const body = headerEl.nextElementSibling;
      body.classList.toggle('collapsed');
    }

    // ---- TAGESBERICHT-MODAL ----
    function openDailyReportModal(dateStr) {
      const selectedDate = dateStr ? new Date(dateStr + 'T12:00:00') : new Date();
      selectedReportDate = getISODate(selectedDate);
      const isoDate = selectedReportDate;
      const kw = getKW(selectedDate);
      const year = selectedDate.getFullYear();
      const dayOfWeek = (selectedDate.getDay() + 6) % 7; // 0=Mo, 4=Fr

      const plan = Storage.getWeekPlan(year, kw);
      const myTasks = plan.filter(t => t.employeeId === currentEmployee.id && (t.day === dayOfWeek || t.day === 'week'));
      // Other day tasks from the same week (excluding selected day)
      const otherTasks = plan.filter(t => t.employeeId === currentEmployee.id && t.day !== dayOfWeek && t.day !== 'week');
      const projects = Storage.getProjects();
      const existingReport = Storage.getDailyReport(isoDate, currentEmployee.id);

      const dayNames = ['Mo', 'Di', 'Mi', 'Do', 'Fr'];

      function renderTaskEntry(task, fromOtherDay) {
        const proj = projects.find(p => p.id === task.projectId);
        const isReported = !!existingReport;
        const dayLabel = fromOtherDay && typeof task.day === 'number' ? `<span class="badge badge-neutral" style="font-size:10px;">${dayNames[task.day] || ''}</span>` : '';
        return `
          <div class="report-task-entry" ${fromOtherDay ? 'style="border-left-color: var(--accent);"' : ''}>
            <div class="task-header">
              <div class="fw-600 text-sm">${proj ? escapeHtml(proj.article) : 'Unbekannt'} ${dayLabel}</div>
              ${isReported
                ? '<span class="badge badge-success" style="font-size:10px;">Berichtet</span>'
                : '<span class="badge badge-warning" style="font-size:10px;">Offen</span>'}
            </div>
            <div class="text-sm text-muted">${proj ? getCustomerName(proj.customerId) : ''}</div>
            <div class="text-sm mt-8"><strong>Aufgabe:</strong> ${escapeHtml(task.description)}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
              <span class="badge badge-info">${escapeHtml(task.area)}</span>
              ${task.plannedQty ? `<span class="badge badge-neutral">${task.plannedQty} Stk.</span>` : ''}
              ${task.plannedMinutes ? `<span class="badge badge-warning">Soll: ${task.plannedMinutes} Min</span>` : ''}
            </div>
            ${!isReported ? `
              <div style="margin-top:8px;">
                <button class="btn btn-accent btn-sm" style="width:100%;" data-desc="${escapeHtml(task.description)}" onclick="closeDailyReportModal(); goToReport(${task.projectId}, '${task.area}', this.dataset.desc, ${task.plannedQty || 0}, '${isoDate}');">
                  Bericht f&uuml;r diese Aufgabe
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }

      let tasksHtml = '';
      if (myTasks.length === 0) {
        tasksHtml = '<div class="text-sm text-muted" style="padding: 12px 0;">Keine Aufgaben f&uuml;r diesen Tag geplant.</div>';
      } else {
        myTasks.forEach(task => { tasksHtml += renderTaskEntry(task, false); });
      }

      let otherTasksHtml = '';
      if (otherTasks.length > 0) {
        otherTasks.forEach(task => { otherTasksHtml += renderTaskEntry(task, true); });
      }

      const overlay = document.createElement('div');
      overlay.className = 'report-modal-overlay';
      overlay.id = 'daily-report-modal';
      overlay.onclick = function(e) { if (e.target === overlay) closeDailyReportModal(); };

      overlay.innerHTML = `
        <div class="report-modal">
          <div class="report-modal-header">
            <div>
              <div class="fw-600" style="font-size:17px;">Tagesbericht</div>
              <div class="text-sm text-muted">${formatDate(selectedDate)}</div>
            </div>
            <button class="report-modal-close" onclick="closeDailyReportModal()">&times;</button>
          </div>
          <div class="report-date-picker">
            <label>Datum:</label>
            <input type="date" id="report-date-input" value="${isoDate}" onchange="closeDailyReportModal(); openDailyReportModal(this.value);">
          </div>
          <div class="report-section-label">Aufgaben f&uuml;r ${formatDate(selectedDate)} (${myTasks.length})</div>
          <div class="report-task-list">${tasksHtml}</div>
          ${otherTasks.length > 0 ? `
            <div class="report-section-label">
              Aufgaben anderer Tage (${otherTasks.length})
              <button class="report-other-tasks-toggle" onclick="document.getElementById('other-day-tasks').style.display = document.getElementById('other-day-tasks').style.display === 'none' ? 'block' : 'none'; this.textContent = document.getElementById('other-day-tasks').style.display === 'none' ? 'Einblenden' : 'Ausblenden';">Einblenden</button>
            </div>
            <div id="other-day-tasks" class="report-task-list" style="display: none;">${otherTasksHtml}</div>
          ` : ''}
          ${existingReport ? `
            <div class="card" style="background: #d5f5e3; border: 1px solid #27ae60;">
              <div class="fw-600 text-sm" style="color: #27ae60;">Tagesbericht bereits eingereicht</div>
              ${existingReport.entries && existingReport.entries.length > 0
                ? existingReport.entries.map(e => {
                    const p = projects.find(pp => pp.id === e.projectId);
                    const timeDiff = (e.actualMinutes || 0) - (e.plannedMinutes || 0);
                    const hasTD = e.plannedMinutes > 0 && e.actualMinutes > 0;
                    return '<div class="text-sm mt-8" style="padding:6px 8px; background:rgba(255,255,255,0.6); border-radius:6px;">'
                      + '<strong>' + escapeHtml(p ? p.article : 'Projekt') + '</strong> (' + escapeHtml(e.area || '') + '): '
                      + escapeHtml(e.completedWork || '-')
                      + (hasTD ? ' <span style="color:' + (timeDiff > 0 ? 'var(--danger)' : 'var(--success)') + '; font-weight:600;">' + (timeDiff > 0 ? '+' : '') + timeDiff + ' Min</span>' : '')
                      + (e.deviation ? ' <span class="badge badge-danger" style="font-size:10px;">Abweichung</span>' : '')
                      + '</div>';
                  }).join('')
                : '<div class="text-sm mt-8"><strong>Erledigt:</strong> ' + escapeHtml(existingReport.completedWork || '-') + '</div>'
              }
              <div class="text-sm mt-8">
                <button class="btn btn-outline btn-sm" onclick="closeDailyReportModal(); editHistoryReport('${isoDate}');">
                  Bericht bearbeiten
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      document.body.appendChild(overlay);
    }

    function closeDailyReportModal() {
      const modal = document.getElementById('daily-report-modal');
      if (modal) modal.remove();
    }

    // ---- AUFGABE SELBST ZUWEISEN ----
    function openSelfAssignModal(preselectedProjectId) {
      const today = new Date();
      const kw = getKW(today);
      const year = today.getFullYear();
      const dayOfWeek = (today.getDay() + 6) % 7;
      const projects = Storage.getProjects();

      const projOptions = projects.map(p =>
        `<option value="${p.id}" ${preselectedProjectId === p.id ? 'selected' : ''}>${escapeHtml(p.article)} (${getCustomerName(p.customerId)})</option>`
      ).join('');

      const dayOptions = `
        <option value="${dayOfWeek}">Heute (${['Mo','Di','Mi','Do','Fr'][dayOfWeek] || 'Heute'})</option>
        <option value="week">Ganze Woche (Mo-Fr)</option>
        ${[0,1,2,3,4].filter(d => d !== dayOfWeek).map(d =>
          `<option value="${d}">${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'][d]}</option>`
        ).join('')}
      `;

      const overlay = document.createElement('div');
      overlay.className = 'report-modal-overlay';
      overlay.id = 'self-assign-modal';
      overlay.onclick = function(e) { if (e.target === overlay) closeSelfAssignModal(); };

      overlay.innerHTML = `
        <div class="report-modal">
          <div class="report-modal-header">
            <div>
              <div class="fw-600" style="font-size:17px;">Aufgabe &uuml;bernehmen</div>
              <div class="text-sm text-muted">KW ${kw} / ${year}</div>
            </div>
            <button class="report-modal-close" onclick="closeSelfAssignModal()">&times;</button>
          </div>
          <form onsubmit="saveSelfAssignedTask(event)">
            <div class="form-group">
              <label>Projekt</label>
              <select class="form-control" id="sa-project" required>${projOptions}</select>
            </div>
            <div class="form-group">
              <label>Bereich</label>
              <select class="form-control" id="sa-area" required>
                <option value="konstruktion">Konstruktion</option>
                <option value="fertigung" selected>Fertigung</option>
                <option value="montage">Montage</option>
              </select>
            </div>
            <div class="form-group">
              <label>Tag</label>
              <select class="form-control" id="sa-day" required>${dayOptions}</select>
            </div>
            <div class="form-group">
              <label>Aufgabenbeschreibung</label>
              <textarea class="form-control" id="sa-desc" rows="3" required placeholder="Was m&ouml;chten Sie an diesem Projekt bearbeiten?"></textarea>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
              <div class="form-group">
                <label>Geplante St&uuml;ckzahl</label>
                <input type="number" class="form-control" id="sa-qty" min="0" placeholder="optional">
              </div>
              <div class="form-group">
                <label>Gesch&auml;tzte Zeit (Min)</label>
                <input type="number" class="form-control" id="sa-minutes" min="0" placeholder="optional">
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Aufgabe zuweisen</button>
          </form>
        </div>
      `;

      document.body.appendChild(overlay);
    }

    function closeSelfAssignModal() {
      const modal = document.getElementById('self-assign-modal');
      if (modal) modal.remove();
    }

    function saveSelfAssignedTask(e) {
      e.preventDefault();
      const today = new Date();
      const kw = getKW(today);
      const year = today.getFullYear();

      const dayVal = document.getElementById('sa-day').value;
      const taskData = {
        employeeId: currentEmployee.id,
        projectId: parseInt(document.getElementById('sa-project').value),
        area: document.getElementById('sa-area').value,
        day: dayVal === 'week' ? 'week' : parseInt(dayVal),
        description: document.getElementById('sa-desc').value.trim(),
        plannedQty: parseInt(document.getElementById('sa-qty').value) || 0,
        plannedMinutes: parseInt(document.getElementById('sa-minutes').value) || 0,
        actualMinutes: 0
      };

      const plan = Storage.getWeekPlan(year, kw);
      plan.push(taskData);
      Storage.saveWeekPlan(year, kw, plan);

      closeSelfAssignModal();
      alert('Aufgabe wurde erfolgreich zugewiesen!');
      renderToday();
    }

    function removeSelfAssignedTask(taskIndex) {
      if (!confirm('Aufgabe wirklich entfernen?')) return;
      const today = new Date();
      const kw = getKW(today);
      const year = today.getFullYear();
      const plan = Storage.getWeekPlan(year, kw);

      if (taskIndex >= 0 && taskIndex < plan.length) {
        plan.splice(taskIndex, 1);
        Storage.saveWeekPlan(year, kw, plan);
        renderToday();
      }
    }

    function markTaskDone(projectId, area, description) {
      // Quick-complete: go directly to report form with this task pre-filled
      goToReport(projectId, area, description, 0);
    }

    // ---- AUFGABEN-FOTOS ----
    function addTaskPhoto(event, projectId) {
      const today = getISODate(new Date());
      const files = event.target.files;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxSize = 1200;
            let w = img.width, h = img.height;
            if (w > maxSize || h > maxSize) {
              if (w > h) { h = (h / w) * maxSize; w = maxSize; }
              else { w = (w / h) * maxSize; h = maxSize; }
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            TaskPhotos.addPhoto(currentEmployee.id, today, projectId, canvas.toDataURL('image/jpeg', 0.7));
            renderToday();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function removeTaskPhoto(projectId, index) {
      if (!confirm('Foto entfernen?')) return;
      const today = getISODate(new Date());
      TaskPhotos.removePhoto(currentEmployee.id, today, projectId, index);
      renderToday();
    }

    // ---- PIN ÄNDERN ----
    function changeMyPin(e) {
      e.preventDefault();
      const oldPin = document.getElementById('my-pin-old').value;
      const newPin = document.getElementById('my-pin-new').value;
      const confirmPin = document.getElementById('my-pin-confirm').value;
      const msgEl = document.getElementById('my-pin-msg');

      if (newPin.length < 4) {
        msgEl.textContent = 'Neue PIN muss mindestens 4 Zeichen haben.';
        msgEl.style.color = 'var(--danger)';
        msgEl.style.display = 'block';
        return;
      }
      if (newPin !== confirmPin) {
        msgEl.textContent = 'Neue PINs stimmen nicht \u00fcberein.';
        msgEl.style.color = 'var(--danger)';
        msgEl.style.display = 'block';
        document.getElementById('my-pin-confirm').value = '';
        document.getElementById('my-pin-confirm').focus();
        return;
      }
      if (Auth.changeEmployeePin(currentEmployee.id, oldPin, newPin)) {
        msgEl.textContent = 'PIN wurde erfolgreich ge\u00e4ndert!';
        msgEl.style.color = 'var(--success)';
        msgEl.style.display = 'block';
        document.getElementById('my-pin-old').value = '';
        document.getElementById('my-pin-new').value = '';
        document.getElementById('my-pin-confirm').value = '';
      } else {
        msgEl.textContent = 'Aktuelle PIN ist falsch.';
        msgEl.style.color = 'var(--danger)';
        msgEl.style.display = 'block';
        document.getElementById('my-pin-old').value = '';
        document.getElementById('my-pin-old').focus();
      }
    }

    // ---- HELPERS ----
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // Init - Supabase laden, dann Login
    Storage.initFromSupabase().then(function() {
      initLogin();
    });
  </script>
</body>
</html>
